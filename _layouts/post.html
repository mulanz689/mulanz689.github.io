<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | truncate: 160 }}">
  <title>{{ page.title }} · Mulan Zhou</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="name" href="{{ '/' | relative_url }}">Mulan Zhou</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/' | relative_url }}#work">Projects</a>
        <a href="{{ '/' | relative_url }}#publications">Publications</a>
        <a href="{{ '/blog.html' | relative_url }}">Blog</a>
      </nav>
    </div>
  </header>
  <main>
    <article class="article-shell wrap">
      <a class="back-link" href="{{ '/blog.html' | relative_url }}">← All posts</a>
      <header class="article-header">
        <p class="eyebrow">Research notes</p>
        <h1 class="article-title">{{ page.title }}</h1>
        <p class="article-date">{{ page.date | date: "%B %-d, %Y" }}</p>
        {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
      </header>
      <div class="article-body">{{ content }}</div>
    </article>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year"></span> Mulan Zhou</span>
      <span><a href="{{ '/blog.html' | relative_url }}">Research notes</a></span>
    </div>
  </footer>
  <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
